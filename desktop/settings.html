<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none';">
  <title>Agent Light 设置</title>
  <link rel="stylesheet" href="./settings.css">
</head>
<body>
  <main class="settings-shell">
    <header class="page-header">
      <div class="app-emblem" aria-hidden="true"><span></span><span></span><span></span></div>
      <div><p class="eyebrow">AGENT LIGHT</p><h1>设置</h1></div>
    </header>

    <section class="hero-panel" aria-labelledby="connection-title">
      <div class="hero-copy">
        <p class="section-kicker">连接中心</p>
        <h2 id="connection-title">让本机 Agent 自动亮起来</h2>
        <p>扫描官方 CLI、应用和配置目录，自动合并 Agent Light 的 Hook 或 Plugin。</p>
      </div>
      <div class="connection-meter" aria-label="Agent 连接概览">
        <strong id="connected-count">—</strong><span>/ 5</span>
        <small id="summary-label">正在扫描</small>
      </div>
    </section>

    <section class="connection-panel" aria-labelledby="agents-title">
      <div class="section-heading">
        <div><p class="section-kicker">本机 Agent</p><h2 id="agents-title">连接状态</h2></div>
        <button id="connect-agents" class="primary-button" type="button">
          <span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 12h8M12 8v8"/><path d="M5.5 5.5a9.2 9.2 0 0 0 0 13M18.5 5.5a9.2 9.2 0 0 1 0 13"/></svg></span>
          <span class="button-label">扫描并连接</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </div>
      <div id="agent-list" class="agent-list" aria-live="polite"></div>
      <div id="connection-note" class="connection-note" role="status">只会修改检测到的 Agent；已有配置会在首次修改前自动备份。</div>
    </section>

    <footer class="settings-footer">
      <span>连接完全在本机完成</span>
      <span>Codex 仍需通过 <code translate="no">/hooks</code> 信任</span>
    </footer>
  </main>
  <script src="../dist/settings-renderer.js"></script>
</body>
</html>
