<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:*; script-src 'self'; style-src 'self'; img-src 'none';">
  <title>Agent Traffic Light</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="collapsed">
  <main id="app" class="shell" aria-live="polite">
    <div class="compact-controls no-drag" aria-label="悬浮窗控制">
      <div class="compact-drag" aria-label="拖动悬浮窗" title="拖动悬浮窗"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01"/></svg></div>
      <button id="compact-expand" class="icon-button" aria-label="展开详情" title="展开详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg></button>
      <button id="compact-pin" class="icon-button active" aria-pressed="true" aria-label="切换始终置顶" title="始终置顶"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6-3 1-4 4-1 5-2-2-4 4-2-2 4-4-2-2 5-1 4-4 1-3Z"/></svg></button>
      <button id="compact-close" class="icon-button" aria-label="关闭悬浮窗" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <header class="titlebar drag-region">
      <div class="brand"><span class="connection" id="connection"></span><span>AGENT LIGHT</span></div>
      <div class="window-actions no-drag">
        <button id="compact" class="icon-button" aria-label="收起详情" title="收起详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5H3m13-5v5h5M8 21v-5H3m13 5v-5h5"/></svg></button>
        <button id="pin" class="icon-button active" aria-pressed="true" aria-label="切换始终置顶" title="始终置顶"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6-3 1-4 4-1 5-2-2-4 4-2-2 4-4-2-2 5-1 4-4 1-3Z"/></svg></button>
        <button id="close" class="icon-button" aria-label="关闭悬浮窗" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </header>
    <section id="content" class="content"><p class="loading">正在连接 VS Code…</p></section>
    <div id="live" class="sr-only" aria-live="polite"></div>
  </main>
  <script src="../dist/desktop-renderer.js"></script>
</body>
</html>
